name: Validate and export
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - run: python3 -m pip install -r harness/requirements-dev.txt
      - run: python3 -m ruff format --check harness scripts/expand-runner-catalog.py
      - run: python3 -m ruff check --select E9,F63,F7,F82 harness scripts/expand-runner-catalog.py
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - run: npm run verify:export
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: static-site
          path: out
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /browser-llm-bench
          NEXT_PUBLIC_SITE_URL: https://benchmark.example/browser-llm-bench
      - run: npm run verify:export
        env:
          NEXT_PUBLIC_BASE_PATH: /browser-llm-bench
          NEXT_PUBLIC_SITE_URL: https://benchmark.example/browser-llm-bench
  macos-collector:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - run: python3 -m unittest discover -s harness/tests
